# Локально всё то же самое запускается одной командой: ./gradlew check

image: eclipse-temurin:25-jdk

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_REF_PROTECTED == 'true'

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

default:
  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x ./gradlew

stages:
  - build
  - verify

build:
  stage: build
  # Error Prone и NullAway работают на этапе компиляции, здесь же и падают.
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs
    expire_in: 1 week

lint:
  stage: verify
  needs: ["build"]
  script:
    - ./gradlew spotlessCheck checkstyleMain checkstyleTest
  artifacts:
    when: always
    paths:
      - build/reports/checkstyle
    expire_in: 1 week

test:
  stage: verify
  needs: ["build"]
  script:
    - ./gradlew test printCoverage
  coverage: '/Покрытие инструкций: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests
      - build/reports/jacoco
    expire_in: 1 week
